<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Casa">
<meta name="theme-color" media="(prefers-color-scheme: dark)" content="#000000">
<meta name="theme-color" media="(prefers-color-scheme: light)" content="#f2f2f7">
<link rel="icon" href="/icons/web/favicon.ico" sizes="any">
<link rel="apple-touch-icon" href="/icons/web/apple-touch-icon.png">
<link rel="manifest" href="/manifest.json">
<title>Casa</title>
<style>
  /* tema: segue o claro/escuro do iPhone. Toda cor da página sai daqui; nada de cor fixa no resto do CSS */
  :root { color-scheme: light dark; --accent: #ffd60a; --ease: cubic-bezier(.2, .9, .25, 1.05);
          --bg: radial-gradient(120% 60% at 50% 0%, #1f2a44 0%, #000 70%);
          --tile: rgb(44 44 46 / .85); --tile-on: #f2f2f7; --tile-on-shadow: none; --txt: #f2f2f7;
          --sub: rgb(235 235 245 / .6); --card: rgb(28 28 30 / .92); --card-solid: #1c1c1e; --card-shadow: none;
          --chip: rgb(118 118 128 / .24); --track: rgb(120 120 128 / .32); --icon-off: rgb(255 255 255 / .12);
          --line: rgb(84 84 88 / .4); --grab: rgb(255 255 255 / .3); --ring: #fff; --outline: rgb(235 235 245 / .25);
          --danger: #ff6961; --blur: blur(18px) brightness(.55) saturate(1.3); }
  @media (prefers-color-scheme: light) {
    :root { --bg: radial-gradient(120% 60% at 50% 0%, #dbe4f5 0%, #f2f2f7 70%);
            --tile: rgb(118 118 128 / .12); --tile-on: #fff; --tile-on-shadow: 0 1px 4px rgb(0 0 0 / .12); --txt: #000;
            --sub: rgb(60 60 67 / .6); --card: rgb(255 255 255 / .96); --card-solid: #fff; --card-shadow: 0 12px 40px rgb(0 0 0 / .18);
            --chip: rgb(118 118 128 / .12); --track: rgb(120 120 128 / .16); --icon-off: rgb(0 0 0 / .06);
            --line: rgb(60 60 67 / .18); --grab: rgb(0 0 0 / .2); --ring: #000; --outline: rgb(60 60 67 / .3);
            --danger: #d70015; --blur: blur(18px) brightness(1.03) saturate(1.2); }
  }
  * { -webkit-tap-highlight-color: transparent; }
  /* o dedo continua pressionado quando o cartão abre: sem isso o iOS seleciona tudo que está embaixo */
  html { -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
  body { margin: 0; padding: 12px 16px 32px; padding-top: max(12px, env(safe-area-inset-top));
         background: var(--bg) fixed; color: var(--txt);
         font: 17px -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, sans-serif; }
  h1 { font-size: 34px; font-weight: 700; margin: 8px 0 4px; letter-spacing: -.02em; }
  h2 { font-size: 20px; font-weight: 600; margin: 22px 0 10px; }
  .erro { color: var(--danger); font-size: 15px; min-height: 1.2em; margin: 4px 0; }
  /* no cartão a linha de erro não reserva espaço: sem erro, some (sem margem nem altura) */
  #c-erro { min-height: 0; margin: 0; overflow: hidden; }
  #c-erro:empty { display: none; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; }

  .tile { position: relative; box-sizing: border-box; height: 72px; padding: 10px 12px; border-radius: 16px;
          background: var(--tile); display: flex; align-items: center; gap: 10px; cursor: pointer;
          touch-action: manipulation; transition: transform .18s var(--ease), background .2s; }
  .tile.pressing { transform: scale(.94); }
  .tile.on { background: var(--tile-on); color: #000; box-shadow: var(--tile-on-shadow); }
  .tile.on .sub { color: rgb(60 60 67 / .6); }
  .tile.offline { opacity: .45; }
  .tile.busy { opacity: .7; }
  .icon { flex: none; width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center;
          color: var(--sub); background: var(--icon-off); }
  svg.ico { fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
  .tile.on .icon { background: var(--dot, var(--accent)); color: #000; }
  .tile .txt { min-width: 0; line-height: 1.2; }
  .tile .name { font-size: 15px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .tile .sub { font-size: 13px; color: var(--sub); }

  /* o desfoque é no próprio conteúdo, não numa camada fixa por cima: o Safari desenha a página embaixo da
     Dynamic Island e da barra de URL, e uma camada fixa escura virava faixas pretas nessas áreas.
     O #overlay fica transparente e só serve para capturar o toque fora do cartão. */
  html.locked, html.locked body { overflow: hidden; }
  #overlay { position: fixed; inset: 0; touch-action: none; }
  h1, main, body > .erro { transition: filter .3s; }
  html.blurred h1, html.blurred main, html.blurred body > .erro { filter: var(--blur); }
  #card { position: fixed; inset: 0; margin: auto; box-sizing: border-box; width: min(380px, calc(100vw - 32px));
          height: fit-content; max-height: calc(100dvh - 48px); overflow: auto; overscroll-behavior: contain;
          border-radius: 28px; background: var(--card); box-shadow: var(--card-shadow); transform-origin: 0 0; padding: 0 20px 22px; }
  [hidden] { display: none !important; }
  .grab { padding: 10px 0 6px; touch-action: none; cursor: grab; }
  .grab::before { content: ""; display: block; width: 36px; height: 5px; border-radius: 3px;
                  background: var(--grab); margin: 0 auto 12px; }
  .grab .name { font-size: 22px; font-weight: 700; }
  .grab .sub { font-size: 15px; color: var(--sub); margin-top: 2px; min-height: 1.2em; }

  .pill { position: relative; width: 120px; height: 300px; max-height: 42dvh; margin: 18px auto 8px;
          border-radius: 36px; background: var(--track); overflow: hidden; touch-action: none; cursor: ns-resize; }
  .pill .fill { position: absolute; left: 0; right: 0; bottom: 0; background: var(--fill, #fff); transition: background .25s; }
  .pill .sun { position: absolute; left: 50%; bottom: 16px; translate: -50%; color: #fff;
               mix-blend-mode: difference; pointer-events: none; }
  .power { display: grid; place-items: center; width: 120px; height: 120px; margin: 22px auto 6px; padding: 0;
           border: 0; border-radius: 50%; cursor: pointer;
           color: var(--sub); background: var(--track); transition: background .2s, color .2s, transform .15s var(--ease); }
  /* tomada: ⏻ e a potência de agora lado a lado, para o cartão não ficar comprido */
  .power-row { display: flex; align-items: center; gap: 20px; margin: 18px 0 4px; }
  .power-row .power { width: 84px; height: 84px; margin: 0; }
  .now .big { font-size: 34px; font-weight: 700; letter-spacing: -.02em; }
  .now .small { font-size: 14px; color: var(--sub); }
  .power.on { background: var(--accent); color: #000; }
  /* afunda rápido ao tocar e volta com um pouco de mola ao soltar */
  .power { transition: background .2s, color .2s, transform .45s cubic-bezier(.3, 1.8, .5, 1); }
  .power:active { transform: scale(.86); transition: background .2s, color .2s, transform .08s ease-out; }
  /* barra de ícones + painel que expande */
  .tools { display: flex; justify-content: center; gap: 14px; margin: 18px 0 4px; }
  .tool { position: relative; display: grid; place-items: center; width: 52px; height: 52px; padding: 0; border: 0;
          border-radius: 50%; background: var(--chip); color: var(--txt); cursor: pointer;
          transition: background .25s, color .25s, transform .45s cubic-bezier(.3, 1.8, .5, 1); }
  .tool:active { transform: scale(.88); transition: background .25s, color .25s, transform .08s ease-out; }
  .tool.on { background: var(--txt); color: var(--card-solid); }
  .tool .badge { position: absolute; top: -2px; right: -2px; min-width: 18px; height: 18px; padding: 0 5px; box-sizing: border-box;
                 border-radius: 9px; background: var(--accent); color: #000; font-size: 11px; font-weight: 700; line-height: 18px; }
  .panel { position: relative; }
  .panel-inner { display: flow-root; padding-top: 10px; }
  .panel.anim { overflow: hidden; }  /* só durante a animação: fixo, cortaria a borda dos chips que rolam */
  .panel .ghost { position: absolute; top: 0; left: 0; right: 0; pointer-events: none; }
  .panel-note { color: var(--sub); font-size: 15px; margin-bottom: 10px; }
  .chip { transition: background .2s, color .2s, transform .15s; }
  .pill .fill { transition: background .25s, height .3s var(--ease); }
  .pill.dragging .fill { transition: background .25s; }
  .sw { transition: box-shadow .2s, transform .15s; }
  .tile.turned-on { animation: tile-on .35s var(--ease); }
  .tile.turned-off { animation: tile-off .35s var(--ease); }
  @keyframes tile-on { from { background: var(--tile); color: var(--txt); } }
  @keyframes tile-off { from { background: var(--tile-on); color: #000; } }
  .tile.turned-on .icon { animation: icon-on .35s var(--ease); }
  .tile.turned-off .icon { animation: icon-off .35s var(--ease); }
  @keyframes icon-on { from { background: var(--icon-off); color: var(--sub); } }
  @keyframes icon-off { from { background: var(--dot, var(--accent)); color: #000; } }
  .hist-plot { aspect-ratio: 340 / 150; margin-top: 6px; }
  .hist-plot svg.chart { margin-top: 0; }

  .row-title { font-size: 13px; color: var(--sub); text-transform: uppercase; letter-spacing: .04em; margin: 18px 0 8px; }
  .swatches { display: flex; gap: 10px; flex-wrap: wrap; }
  .sw { width: 38px; height: 38px; border-radius: 50%; border: 0; padding: 0; background: var(--c);
        box-shadow: 0 0 0 2px transparent; transition: box-shadow .15s, transform .15s; cursor: pointer; }
  .sw.sel { box-shadow: 0 0 0 2px var(--card-solid), 0 0 0 4px var(--ring); }
  .sw:active { transform: scale(.9); }
  .sw.custom { background: conic-gradient(red, yellow, lime, cyan, blue, magenta, red); position: relative; overflow: hidden; }
  .sw.custom input { position: absolute; inset: 0; opacity: 0; width: 100%; height: 100%; cursor: pointer; }
  .chips { display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none; margin: 0 -20px; padding: 0 20px; }
  .chips::-webkit-scrollbar { display: none; }
  .chip { flex: none; font: inherit; font-size: 15px; color: var(--txt); background: var(--chip); border: 0;
          border-radius: 999px; padding: 8px 14px; cursor: pointer; }
  .chip.sel { background: var(--txt); color: var(--card-solid); }
  .chip:active { transform: scale(.95); }

  /* cenas */
  .tile.scene { justify-content: flex-start; }
  .tile.scene.new { background: transparent; box-shadow: inset 0 0 0 1.5px var(--outline); color: var(--sub); }
  input.name-input { -webkit-user-select: text; user-select: text; box-sizing: border-box; width: 100%;
         font: inherit; font-size: 20px; color: inherit; background: var(--chip); border: 0; border-radius: 12px;
         padding: 12px 14px; margin-top: 8px; }
  .row { display: flex; align-items: center; gap: 10px; min-height: 48px; border-bottom: 1px solid var(--line); cursor: pointer; }
  .row .grow { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .row .muted { color: var(--sub); font-size: 15px; white-space: nowrap; }
  .row.add { color: var(--accent); border-bottom: 0; }
  .dot { flex: none; width: 12px; height: 12px; border-radius: 50%; box-shadow: inset 0 0 0 1.5px var(--outline); }
  .actions { display: flex; justify-content: space-between; gap: 10px; margin-top: 22px; }
  .actions .primary { margin-left: auto; }
  .btn { font: inherit; border: 0; border-radius: 12px; padding: 12px 18px; background: var(--chip); color: var(--txt); cursor: pointer; }
  .btn.primary { background: var(--accent); color: #000; font-weight: 600; }
  .btn.danger { color: var(--danger); }
  .btn.link { background: none; color: var(--accent); padding: 4px 0; margin-top: 4px; }
  .btn.x { background: none; color: var(--sub); padding: 8px; }

  /* histórico: série única em âmbar validado contra os dois cartões (#b88600: escuro L 0.48–0.67, claro L 0.43–0.77, contraste ≥ 3:1) */
  .hist { --chart: #b88600; }
  .hist-stats { font-size: 17px; font-weight: 600; margin: 12px 0 2px; }
  .hist-readout { font-size: 14px; color: var(--sub); min-height: 1.3em; font-variant-numeric: tabular-nums; }
  svg.chart { display: block; width: 100%; height: auto; margin-top: 6px; touch-action: none; overflow: visible; }
  svg.chart .grid { stroke: var(--line); stroke-width: 1; }
  svg.chart .tick { fill: var(--sub); font-size: 10px; font-variant-numeric: tabular-nums; }
  svg.chart .line { fill: none; stroke: var(--chart); stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
  svg.chart .area { fill: var(--chart); fill-opacity: .1; stroke: none; }
  svg.chart .bar { fill: var(--chart); transition: opacity .15s; }
  svg.chart .bar.dim { opacity: .35; }
  svg.chart .cross { stroke: var(--sub); stroke-width: 1; }
  svg.chart .dot-mark { fill: var(--chart); stroke: var(--card-solid); stroke-width: 2; }
  .sr-only { position: absolute; width: 1px; height: 1px; margin: -1px; padding: 0; border: 0; overflow: hidden;
             clip: rect(0 0 0 0); white-space: nowrap; }
</style>
</head>
<body>
<h1>Casa</h1>
<div class="erro" id="erro" role="status"></div>
<main id="app"></main>
<div id="overlay" hidden></div>
<div id="card" hidden role="dialog" aria-modal="true">
  <div class="grab"><div class="name" id="c-name"></div><div class="sub" id="c-sub"></div></div>
  <div class="erro" id="c-erro" role="status"></div>
  <div id="c-body"></div>
</div>
<script type="module">
import {readLight, brightCmd, colourCmd, whiteCmd, effectCmd, effectsFor, stateDps, EFFECTS} from '/codec.js';

const COLORS = [[0, 900], [28, 950], [50, 950], [120, 700], [185, 800], [215, 900], [270, 750], [320, 800]];  // h, s
const WHITES = [[0, '#ffc98a'], [30, '#ffe0b8'], [60, '#fff4e6'], [100, '#e6efff']];  // temperatura %, cor na tela
const TIMERS = [15, 30, 60, 120];

const $ = id => document.getElementById(id);
const el = (tag, props = {}, ...kids) => { const e = Object.assign(document.createElement(tag), props); e.append(...kids); return e; };
const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
const isLight = it => it.group === 'Lâmpadas' || it.group === 'Fitas LED';
const byId = id => last.find(x => x.id === id);
let last = [], scenes = [], pressing = false;
// cartão aberto: {kind: 'device', key, id} ou {kind: 'scene', key, draft, isNew, sub, adding}.
// key = data-id do bloco de onde o cartão nasceu (e para onde volta ao fechar)
let current = null;
let hiddenTile = null;  // key do bloco escondido enquanto "vira" o cartão (abrir e fechar)

function colorOf(it) {
  if (!isLight(it)) return 'var(--accent)';
  const l = readLight(it);
  if (l.mode === 'scene') return 'linear-gradient(180deg, #ff5f6d, #ffc371, #47e891, #3fa7ff)';
  if (l.mode === 'white') return WHITES.reduce((a, w) => Math.abs(w[0] - l.temp) < Math.abs(a[0] - l.temp) ? w : a)[1];
  return `hsl(${l.h} ${l.s / 10}% 58%)`;
}
// ligado/desligado já aparece no bloco aceso e no ícone; o texto fica só para o que é especial
// watts=false no cabeçalho do cartão da tomada: lá a potência já aparece grande ao lado do ⏻
function status(it, watts = true) {
  if (!it.online) return 'Sem resposta';
  const parts = [];
  if (watts && it.on && it.watts != null) parts.push(`${it.watts.toFixed(1).replace('.', ',')} W`);
  if (it.on && isLight(it)) {
    const l = readLight(it);
    parts.push(l.mode === 'scene' ? EFFECTS[l.scene]?.name ?? 'Efeito' : `${l.bright}%`);
  }
  const left = it.timer_dp ? it.dps[it.timer_dp] || 0 : 0;
  if (left) parts.push(`⏱ ${Math.ceil(left / 60)} min`);
  return parts.join(' · ');
}
// ícones de traço no estilo dos símbolos do iOS (os emojis vinham coloridos e fora do visual)
const ICONS = {
  bulb: ['M9 18h6', 'M10 21h4', 'M12 3a6 6 0 0 0-3.6 10.8c.7.6 1.1 1.3 1.1 2.1v.1h5v-.1c0-.8.4-1.5 1.1-2.1A6 6 0 0 0 12 3z'],
  strip: ['M2.5 9.5c3.2 0 3.2 5 6.3 5s3.2-5 6.4-5 3.2 5 6.3 5'],
  plug: ['M9 3v5', 'M15 3v5', 'M6.5 8h11v3a5.5 5.5 0 0 1-11 0z', 'M12 16.5V21'],
  power: ['M12 3.5v8', 'M6.8 6.6a7.5 7.5 0 1 0 10.4 0'],
  sparkles: ['M11 3.5l1.6 4.4 4.4 1.6-4.4 1.6L11 15.5l-1.6-4.4L5 9.5l4.4-1.6z', 'M18 14l.8 2.2 2.2.8-2.2.8L18 20l-.8-2.2-2.2-.8 2.2-.8z'],
  timer: ['M19.5 13.5a7.5 7.5 0 1 1-15 0a7.5 7.5 0 1 1 15 0', 'M12 13.5V10', 'M9.5 2.5h5', 'M12 2.5V6'],
  bolt: ['M13.5 2.5L5.5 13.5h6l-1 8 8-11h-6z'],
  sun: ['M16 12a4 4 0 1 1-8 0a4 4 0 1 1 8 0', 'M12 2.5v2', 'M12 19.5v2', 'M2.5 12h2', 'M19.5 12h2',
        'M5.3 5.3l1.4 1.4', 'M17.3 17.3l1.4 1.4', 'M5.3 18.7l1.4-1.4', 'M17.3 6.7l1.4-1.4'],
};
function icon(name, size = 20) {
  const s = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
  s.setAttribute('viewBox', '0 0 24 24'); s.setAttribute('width', size); s.setAttribute('height', size);
  s.setAttribute('class', 'ico'); s.setAttribute('aria-hidden', 'true');
  for (const d of ICONS[name]) { const p = document.createElementNS('http://www.w3.org/2000/svg', 'path'); p.setAttribute('d', d); s.append(p); }
  return s;
}
const iconOf = it => ({'Fitas LED': 'strip', 'Tomadas': 'plug'})[it.group] ?? 'bulb';
function showError(msg) {
  $('erro').textContent = msg;
  const e = $('c-erro'), had = e.textContent;
  if (had === msg) return;
  e.getAnimations().forEach(a => a.cancel());
  if (msg && !had) {  // aparece: abre a altura
    e.textContent = msg;
    if (!$('card').hidden) e.animate([{height: '0px', opacity: 0}, {height: e.scrollHeight + 'px', opacity: 1}], {duration: 220, easing: 'ease-out'});
  } else if (!msg && !$('card').hidden) {  // some: fecha a altura e só então esvazia
    e.animate([{height: e.offsetHeight + 'px', opacity: 1}, {height: '0px', opacity: 0}], {duration: 180, easing: 'ease-in'})
      .onfinish = () => { if (e.textContent === had) e.textContent = ''; };
  } else e.textContent = msg;
}

// ---- servidor ----
async function load() {
  try {
    const r = await fetch('/api/state');
    last = await r.json();
    if (!outbox.size) showError('');
    render();
    if (current?.kind === 'device') {
      const it = byId(current.id);
      $('c-sub').textContent = status(it, false);
      const big = $('card').querySelector('.now .big');  // potência de agora acompanha o poll
      if (big && it.watts != null) big.textContent = it.on ? `${num(it.watts, 1)} W` : '—';
    }
  } catch (e) {
    showError('Sem conexão com o servidor');
  }
}
async function loadScenes() {
  try { scenes = await (await fetch('/api/scenes')).json(); render(); } catch (e) { showError('Sem conexão com o servidor'); }
}

// fila por aparelho: no máximo uma escrita em andamento; o que chega nesse meio tempo é juntado e vai
// na próxima, 250 ms depois. Arrastar a pílula manda dezenas de eventos por segundo e a lâmpada não aguenta.
const outbox = new Map();  // id → {dps, done: [callbacks]}
function send(it, dps, done) {
  // otimista: o estado muda na hora; a resposta do aparelho confirma (ou o poll corrige) depois
  last = last.map(x => x.id === it.id ? {...x, dps: {...x.dps, ...dps}, on: x.dp in dps ? dps[x.dp] : x.on} : x);
  const box = outbox.get(it.id);
  if (box) { Object.assign(box.dps, dps); if (done) box.done.push(done); return; }
  outbox.set(it.id, {dps: {...dps}, done: done ? [done] : []});
  render();
  flush(it.id);
}
async function flush(id) {
  const box = outbox.get(id);
  while (Object.keys(box.dps).length) {
    const dps = box.dps;
    box.dps = {};
    try {
      const r = await fetch('/api/set/' + id, {method: 'POST', headers: {'Content-Type': 'application/json'},
                                               body: JSON.stringify({dps})});
      const body = await r.json();
      if (!r.ok) throw new Error(body.error);
      last = last.map(x => x.id === id ? body : x);
      showError('');
    } catch (e) {
      showError(`${byId(id).name}: ${e.message}`);
      load();  // desfaz o otimista com o estado de verdade
    }
    if (Object.keys(box.dps).length) await new Promise(ok => setTimeout(ok, 250));
  }
  outbox.delete(id);
  render();
  box.done.forEach(f => f());
}

const running = new Set();  // cenas sendo aplicadas
async function runScene(sc) {
  if (running.has(sc.id)) return;
  running.add(sc.id);
  render();
  try {
    const r = await fetch(`/api/scenes/${sc.id}/run`, {method: 'POST'});
    const body = await r.json();
    if (!r.ok) throw new Error(body.error);
    const n = Object.keys(sc.devices).length;
    showError(body.failed.length ? `${sc.name}: ${body.failed.length} de ${n} falharam (${body.failed.join(', ')})` : '');
  } catch (e) {
    showError(`${sc.name}: ${e.message}`);
  }
  running.delete(sc.id);
  await load();
}

// ---- grade ----
function tile(key, cls, onTap, onHold) {
  const t = el('div', {role: 'button', tabIndex: 0, className: ['tile', ...cls].filter(Boolean).join(' ')});
  t.dataset.id = key;
  if (key === hiddenTile) t.style.visibility = 'hidden';  // poll no meio da animação não pode revelar o bloco
  if (onTap) longPress(t, onTap, onHold);
  return t;
}
const prevOn = new Map();  // estado do último desenho de cada bloco, para animar só o que mudou
function render() {
  if (pressing) return;  // re-render no meio do toque e segure perderia o gesto
  $('app').replaceChildren();
  const section = (title) => { const g = el('div', {className: 'grid'}); $('app').append(el('h2', {textContent: title}), g); return g; };

  const sg = section('Cenas');
  for (const sc of scenes) {
    const t = tile('scene:' + sc.id, ['scene', running.has(sc.id) && 'on busy'],
                     () => runScene(sc), () => openScene(sc));
    t.append(el('div', {className: 'txt'}, el('div', {className: 'name', textContent: sc.name})));
    sg.append(t);
  }
  const nt = tile('scene:new', ['scene', 'new'], () => openScene(null), () => openScene(null));
  nt.append(el('div', {className: 'txt'}, el('div', {className: 'name', textContent: '＋ Nova'})));
  sg.append(nt);

  let grid;
  for (const it of last) {
    if (!grid || grid.dataset.group !== it.group) { grid = section(it.group); grid.dataset.group = it.group; }
    const was = prevOn.get(it.id);
    prevOn.set(it.id, it.on);
    const turned = was !== undefined && was !== it.on && (it.on ? 'turned-on' : 'turned-off');
    const t = tile(it.id, [it.on && 'on', !it.online && 'offline', outbox.has(it.id) && 'busy', turned],
                     it.online && (() => send(it, {[it.dp]: !it.on})), () => openDevice(it.id));
    t.append(el('div', {className: 'icon'}, icon(iconOf(it))),
             el('div', {className: 'txt'}, el('div', {className: 'name', textContent: it.name}),
                                          el('div', {className: 'sub', textContent: status(it)})));
    t.setAttribute('aria-pressed', String(!!it.on));
    const dot = colorOf(it);
    t.style.setProperty('--dot', dot.startsWith('linear') ? '#ffc371' : dot);
    grid.append(t);
  }
}
const tileOf = key => document.querySelector(`.tile[data-id="${key}"]`);
function hideTile(key) { hiddenTile = key; tileOf(key).style.visibility = 'hidden'; }
function showTile() { const t = hiddenTile && tileOf(hiddenTile); hiddenTile = null; if (t) t.style.visibility = ''; }

// toque curto = onTap; segurar 500 ms = onHold. Mexer o dedo > 10 px (rolagem) cancela.
function longPress(t, onTap, onHold) {
  let timer, held, x0, y0;
  const cancel = () => { clearTimeout(timer); t.classList.remove('pressing'); pressing = false; };
  t.addEventListener('pointerdown', e => {
    held = false; x0 = e.clientX; y0 = e.clientY; pressing = true;
    t.classList.add('pressing');
    timer = setTimeout(() => { held = true; cancel(); onHold(); }, 500);
  });
  t.addEventListener('pointermove', e => { if (Math.hypot(e.clientX - x0, e.clientY - y0) > 10) cancel(); });
  ['pointerup', 'pointercancel', 'pointerleave'].forEach(ev => t.addEventListener(ev, cancel));
  t.addEventListener('contextmenu', e => e.preventDefault());
  t.addEventListener('click', () => { if (!held) { onTap(); } });
}

// ---- cartão expandido (FLIP: nasce do retângulo do bloco) ----
// keyframe que põe o cartão exatamente sobre `rect` (o bloco). O raio é dividido pela escala
// de cada eixo para o canto continuar redondo em vez de virar elipse esticada.
function flipFrom(rect, radius = 16) {
  const to = $('card').getBoundingClientRect();
  const sx = rect.width / to.width, sy = rect.height / to.height;
  return {transform: `translate(${rect.left - to.left}px, ${rect.top - to.top}px) scale(${sx}, ${sy})`,
          borderRadius: `${radius / sx}px / ${radius / sy}px`};
}
const contentParts = () => [$('c-body'), $('c-erro'), $('card').querySelector('.grab')];

// com o cartão aberto o fundo não rola. Cartão sem rolagem própria só aceita gesto horizontal (a fileira
// de efeitos); o vertical "vazava" para a página desfocada atrás.
function lockScroll(on) {
  document.documentElement.classList.toggle('locked', on);
  const card = $('card');
  card.style.touchAction = on && card.scrollHeight <= card.clientHeight ? 'pan-x' : '';
}

function openCard(state) {
  current = state;
  $('c-erro').textContent = '';
  renderCard();
  $('overlay').hidden = $('card').hidden = false;
  lockScroll(true);
  const key = state.key;
  const from = tileOf(key).getBoundingClientRect();
  const grow = $('card').animate([flipFrom(from), {transform: 'none', borderRadius: '28px'}],
                                 {duration: 420, easing: 'cubic-bezier(.2, .9, .25, 1.04)'});
  for (const part of contentParts())
    part.animate([{opacity: 0}, {opacity: 1}], {duration: 220, delay: 180, fill: 'backwards'});
  document.documentElement.classList.add('blurred');
  hideTile(key);
  // o bloco some só enquanto "vira" o cartão; parado, ele volta desfocado atrás
  grow.onfinish = () => { if (current === state) showTile(); };
}
const openDevice = id => openCard({kind: 'device', key: id, id});

function closeCard(fromY = 0) {
  if (!current) return;
  let key = current.key;
  current = null;
  $('card').querySelector('input:focus')?.blur();  // fecha o teclado do nome da cena
  render();  // o bloco já reflete o que mudou no cartão
  if (!tileOf(key)) key = 'scene:new';  // cena excluída: volta para o "＋ Nova"
  hideTile(key);
  const to = tileOf(key).getBoundingClientRect();
  const card = $('card');
  card.style.transform = '';
  const start = fromY ? `translateY(${fromY}px)` : 'none';
  // o conteúdo some ANTES de o cartão começar a encolher, então nunca aparece esmagado
  for (const part of contentParts()) part.animate([{opacity: 1}, {opacity: 0}], {duration: 90, fill: 'forwards'});
  const a = card.animate([{transform: start, borderRadius: '28px'}, flipFrom(to)],
                         {duration: 340, delay: 60, easing: 'cubic-bezier(.3, 0, .2, 1)', fill: 'forwards'});
  document.documentElement.classList.remove('blurred');
  a.onfinish = () => {  // fill: forwards segura o último quadro; sem ele o cartão grande piscava antes de sumir
    lockScroll(false);
    showTile();
    card.hidden = $('overlay').hidden = true;
    [card, ...contentParts()].flatMap(x => x.getAnimations()).forEach(x => x.cancel());
  };
}
$('overlay').addEventListener('click', () => closeCard());

// arrastar para baixo pelo topo do cartão fecha
(() => {
  const grab = $('card').querySelector('.grab');
  let y0 = null, dy = 0;
  grab.addEventListener('pointerdown', e => { y0 = e.clientY; dy = 0; grab.setPointerCapture(e.pointerId); });
  grab.addEventListener('pointermove', e => {
    if (y0 === null) return;
    dy = Math.max(0, e.clientY - y0);
    $('card').style.transform = `translateY(${dy}px)`;
  });
  grab.addEventListener('pointerup', () => {
    if (y0 === null) return;
    y0 = null;
    if (dy > 90) return closeCard(dy);
    $('card').animate([{transform: `translateY(${dy}px)`}, {transform: 'none'}], {duration: 250, easing: 'cubic-bezier(.2, .9, .25, 1.1)'});
    $('card').style.transform = '';
  });
})();

function renderCard() {
  $('c-body').replaceChildren();
  if (current.kind === 'device') renderDevice(liveTarget(current.id));
  else renderScene();
  if (!$('card').hidden) lockScroll(true);  // o conteúdo mudou de altura: rever se o cartão rola
}

// ---- controles de um aparelho ----
// `tg` é o destino dos controles: o aparelho de verdade (liveTarget) ou o rascunho de uma cena (draftTarget).
//   tg.get()      estado atual do item
//   tg.apply(dps) comando pontual (cor, efeito, ⏻...) e redesenha o cartão depois
//   tg.drag(dps)  comando contínuo (arrasto, cor livre): sem redesenhar
//   tg.dragEnd()  fim do arrasto
const redraw = () => { if (current) renderCard(); };
const liveTarget = id => ({
  timer: true,
  get: () => byId(id),
  apply: dps => send(byId(id), dps, redraw),
  drag: dps => send(byId(id), dps),
  dragEnd: () => send(byId(id), {}, redraw),
});

function renderDevice(tg, extra = []) {
  const it = tg.get();
  $('c-name').textContent = it.name;
  $('c-sub').textContent = status(it, false);
  const body = $('c-body'), tools = [];
  body.append(...extra);
  if (isLight(it)) {
    const l = readLight(it);
    body.append(brightPill(tg));
    // uma fileira só: cores, o seletor livre e, depois dele, os brancos (só lâmpada tem branco regulável)
    const whites = it.codes.temp_value_v2 ? WHITES.map(([temp, c]) => ({c, sel: l.mode === 'white' && Math.abs(l.temp - temp) <= 5,
                                                                      pick: () => tg.apply(whiteCmd(tg.get(), temp))})) : [];
    body.append(el('div', {className: 'row-title', textContent: 'Cores'}), swatchRow(
      COLORS.map(([h, s]) => ({c: `hsl(${h} ${s / 10}% 58%)`, sel: l.mode === 'colour' && l.h === h && l.s === s,
                               pick: () => tg.apply(colourCmd(tg.get(), h, s))})), tg, whites));
    tools.push({key: 'fx', icon: 'sparkles', label: 'Efeitos', badge: l.mode === 'scene' && it.on ? '•' : '',
      build: box => box.append(chipRow(effectsFor(it).map(([i, e]) => ({
        label: e.name, sel: l.mode === 'scene' && l.scene === i, pick: () => tg.apply(effectCmd(tg.get(), i))}))))});
  } else {
    const b = el('button', {className: 'power' + (it.on ? ' on' : ''), ariaLabel: 'Liga/desliga'}, icon('power', it.watts != null ? 34 : 46));
    b.setAttribute('aria-pressed', String(!!it.on));
    b.onclick = () => {
      b.classList.toggle('on');  // muda na hora; a resposta do aparelho confirma no redesenho
      tg.apply({[it.dp]: !tg.get().on});
    };
    if (it.watts != null) {  // tomada: ⏻ ao lado da potência de agora
      body.append(el('div', {className: 'power-row'}, b, el('div', {className: 'now'},
        el('div', {className: 'big', textContent: it.on ? `${num(it.watts, 1)} W` : '—'}),
        el('div', {className: 'small', textContent: it.on ? 'agora' : 'desligada'}))));
    } else body.append(b);
  }
  if (tg.timer && it.timer_dp) {
    const left = Math.ceil((it.dps[it.timer_dp] || 0) / 60);
    const opts = TIMERS.map(m => ({label: m < 60 ? `${m} min` : `${m / 60} h`, pick: () => tg.apply({[it.timer_dp]: m * 60})}));
    if (left) opts.push({label: 'Cancelar', pick: () => tg.apply({[it.timer_dp]: 0})});
    tools.push({key: 'timer', icon: 'timer', label: 'Timer', badge: left ? String(left) : '', build: box => {
      if (left) box.append(el('div', {className: 'panel-note', textContent: `${it.on ? 'Desliga' : 'Liga'} em ${left} min`}));
      box.append(chipRow(opts));
    }});
  }
  // consumo: tomadas, só no cartão real (não no editor de cena)
  if (tg.timer && it.watts != null) tools.push({key: 'hist', icon: 'bolt', label: 'Consumo', build: box => fillHistory(it, box)});
  if (tools.length) body.append(toolbar(tools));
}

function brightPill(tg) {
  const fill = el('div', {className: 'fill'});
  const sun = icon('sun', 28);
  sun.classList.add('sun');
  const p = el('div', {className: 'pill'}, fill, sun);
  const it = tg.get(), l = readLight(it);
  let pct = it.on ? l.bright : 0;
  const paint = () => { fill.style.height = pct + '%'; p.style.setProperty('--fill', colorOf(tg.get())); };
  paint();
  let y0 = null, v0, moved;
  p.addEventListener('pointerdown', e => { y0 = e.clientY; v0 = pct; moved = false; p.setPointerCapture(e.pointerId); });
  p.addEventListener('pointermove', e => {
    if (y0 === null || l.mode === 'scene') return;  // efeito não tem brilho próprio: só liga/desliga
    const dv = (y0 - e.clientY) / p.clientHeight * 100;
    if (Math.abs(dv) > 1) moved = true;
    if (!moved) return;
    p.classList.add('dragging');
    pct = Math.round(clamp(v0 + dv, 0, 100));
    tg.drag(brightCmd(tg.get(), pct));
    paint();
    $('c-sub').textContent = pct ? `${pct}%` : '';
  });
  p.addEventListener('pointerup', () => {
    if (y0 !== null && !moved) { tg.apply({[it.dp]: !tg.get().on}); }  // toque sem arrastar = liga/desliga
    else if (y0 !== null) tg.dragEnd();
    p.classList.remove('dragging');
    y0 = null;
  });
  return p;
}

function swatchRow(items, tg, after = []) {
  const row = el('div', {className: 'swatches'});
  const add = s => {
    const b = el('button', {className: 'sw' + (s.sel ? ' sel' : ''), onclick: () => {
      $('card').querySelectorAll('.sw.sel').forEach(x => x.classList.remove('sel'));
      b.classList.add('sel');
      $('card').querySelector('.pill')?.style.setProperty('--fill', s.c);  // a pílula já troca de cor, com transição
      s.pick();
    }});
    b.style.setProperty('--c', s.c);
    row.append(b);
  };
  items.forEach(add);
  if (tg) {  // cor livre
    const input = el('input', {type: 'color', value: '#ff8800'});
    const label = el('label', {className: 'sw custom', title: 'Outra cor'}, input);
    // aplica só quando o seletor fecha ('change'): a janela do iOS já mostra a cor escolhida enquanto arrasta.
    // e sem redesenhar aqui (tg.drag): recriar o input preso ao seletor nativo derrubava o Safari (SIGABRT).
    input.addEventListener('change', () => {
      const [r, g, b] = [1, 3, 5].map(i => parseInt(input.value.slice(i, i + 2), 16) / 255);
      const max = Math.max(r, g, b), min = Math.min(r, g, b), c = max - min;
      const h = c === 0 ? 0 : max === r ? 60 * (((g - b) / c) % 6) : max === g ? 60 * ((b - r) / c + 2) : 60 * ((r - g) / c + 4);
      $('card').querySelectorAll('.sw.sel').forEach(x => x.classList.remove('sel'));
      label.classList.add('sel');
      tg.drag(colourCmd(tg.get(), Math.round((h + 360) % 360), Math.round(max ? c / max * 1000 : 0)));
    });
    row.append(label);
  }
  after.forEach(add);
  return row;
}

function chipRow(items) {
  const row = el('div', {className: 'chips'});
  for (const c of items) {
    const b = el('button', {className: 'chip' + (c.sel ? ' sel' : ''), textContent: c.label, onclick: () => {
      if ('sel' in c) { row.querySelectorAll('.chip.sel').forEach(x => x.classList.remove('sel')); b.classList.add('sel'); }
      c.pick();
    }});
    row.append(b);
  }
  return row;
}

// ---- histórico de consumo (tomadas) ----
const RANGE_LABEL = {'24h': '24 h', '7d': '7 dias', '30d': '30 dias'};
const num = (v, d = 1) => v.toLocaleString('pt-BR', {minimumFractionDigits: d, maximumFractionDigits: d});
const svgEl = (tag, attrs = {}) => { const e = document.createElementNS('http://www.w3.org/2000/svg', tag);
  for (const [k, v] of Object.entries(attrs)) e.setAttribute(k, v); return e; };
const niceMax = v => { if (!(v > 0)) return 1; const p = 10 ** Math.floor(Math.log10(v)); return [1, 2, 2.5, 5, 10].find(m => m * p >= v) * p; };

// retraída por padrão: o cabeçalho abre e fecha; o histórico só é buscado aberto.
// O estado vive em `current`, então sobrevive aos redesenhos do cartão e zera ao fechar o cartão.
function fillHistory(it, wrap) {
  const box = el('div', {className: 'hist'});
  const stats = el('div', {className: 'hist-stats', textContent: ' '}), readout = el('div', {className: 'hist-readout'});
  const plot = el('div', {className: 'hist-plot'});  // altura do gráfico reservada antes de o dado chegar
  // trocar o período troca só o gráfico, em fade; o cartão não é redesenhado
  const chips = chipRow(Object.entries(RANGE_LABEL).map(([k, label]) => ({label, sel: k === (current.range ??= '24h'),
    pick: () => { current.range = k; show(k); }})));
  box.append(chips, stats, readout, plot);
  wrap.append(box);
  function show(range) {
    fetch(`/api/history/${it.id}?range=${range}`).then(r => r.json()).then(h => {
      if (current?.id !== it.id || current.range !== range) return;  // o cartão ou o período mudou enquanto buscava
      stats.textContent = h.points.length ? `${num(h.kwh, 2)} kWh · média ${num(h.avg_w, 0)} W`
                                          : 'Sem dados ainda: o histórico começa a contar agora.';
      readout.textContent = '';
      plot.replaceChildren(...(h.points.length ? [h.unit === 'kWh' ? dayBars(h, readout) : powerArea(h, readout), dataTable(h)] : []));
      for (const e of [plot, stats]) e.animate([{opacity: 0}, {opacity: 1}], {duration: 220, easing: 'ease-out'});
    }).catch(() => { stats.textContent = 'Não consegui carregar o histórico.'; });
  }
  show(current.range);
}

// barra de ícones do cartão (Efeitos, Timer, Consumo): tocar num ícone expande o painel com aquilo; tocar em
// outro troca o conteúdo (o antigo sai em fade por cima, o novo entra, a altura acompanha); tocar no ativo recolhe.
// O ícone aberto fica em current.tab e sobrevive aos redesenhos do cartão (sem animar de novo).
function toolbar(tools) {
  if (!tools.some(t => t.key === current.tab)) current.tab = null;
  const panel = el('div', {className: 'panel', hidden: !current.tab});
  // o espaçamento fica num invólucro interno (flow-root): o painel que anima não tem padding nem margem vazando,
  // então a altura medida, a animada e a final são o mesmo número (com padding no painel ele passava 10 px e voltava)
  const fill = key => { const inner = el('div', {className: 'panel-inner'}); tools.find(t => t.key === key).build(inner); panel.append(inner); };
  if (current.tab) fill(current.tab);
  const btns = tools.map(t => {
    const b = el('button', {className: 'tool' + (t.key === current.tab ? ' on' : ''), ariaLabel: t.label}, icon(t.icon, 22));
    b.setAttribute('aria-pressed', String(t.key === current.tab));
    if (t.badge) b.append(el('span', {className: 'badge', textContent: t.badge}));
    b.onclick = () => select(t.key);
    return b;
  });
  function select(key) {
    const next = current.tab === key ? null : key;
    current.tab = next;
    tools.forEach((t, i) => { btns[i].classList.toggle('on', t.key === next); btns[i].setAttribute('aria-pressed', String(t.key === next)); });
    const from = panel.hidden ? 0 : panel.offsetHeight;
    const old = [...panel.children];
    panel.getAnimations().forEach(a => a.cancel());
    panel.classList.add('anim');
    panel.hidden = false;
    panel.replaceChildren();
    if (next) fill(next);
    const fresh = [...panel.children];
    const to = next ? panel.scrollHeight : 0;  // medido antes de o conteúdo antigo voltar como fantasma
    if (old.length) {
      const ghost = el('div', {className: 'ghost'}, ...old);
      panel.append(ghost);
      ghost.animate([{opacity: 1}, {opacity: 0}], {duration: 140, fill: 'forwards'}).onfinish = () => ghost.remove();
    }
    for (const c of fresh) c.animate([{opacity: 0, transform: 'translateY(6px)'}, {opacity: 1, transform: 'none'}],
                                     {duration: 240, delay: old.length ? 100 : 60, easing: 'ease-out', fill: 'backwards'});
    panel.animate([{height: from + 'px'}, {height: to + 'px'}], {duration: 320, easing: 'cubic-bezier(.2, .9, .25, 1)'}).onfinish = () => {
      panel.classList.remove('anim');
      if (!current || current.tab !== next) return;
      if (!next) panel.hidden = true;
      lockScroll(true);
    };
  }
  return el('div', {className: 'toolwrap'}, el('div', {className: 'tools'}, ...btns), panel);
}

// geometria comum: 340×150 no viewBox, escala uniforme com o cartão
const G = {w: 340, h: 150, l: 50, r: 8, t: 10, b: 20};
function frame(max, fmt) {
  const svg = svgEl('svg', {viewBox: `0 0 ${G.w} ${G.h}`, class: 'chart', role: 'img'});
  const y = v => G.t + (1 - v / max) * (G.h - G.t - G.b);
  for (const v of [0, max / 2, max]) {
    svg.append(svgEl('line', {x1: G.l, x2: G.w - G.r, y1: y(v), y2: y(v), class: 'grid'}));
    const t = svgEl('text', {x: G.l - 6, y: y(v) + 4, 'text-anchor': 'end', class: 'tick'});
    t.textContent = fmt(v);
    svg.append(t);
  }
  return {svg, y};
}
function xLabel(svg, x, text, anchor = 'middle') {
  const t = svgEl('text', {x, y: G.h - 4, 'text-anchor': anchor, class: 'tick'});
  t.textContent = text;
  svg.append(t);
}
// arrastar o dedo: acha o ponto mais próximo no X e chama show(i)
function scrub(svg, xs, show) {
  const pick = e => {
    const r = svg.getBoundingClientRect(), x = (e.clientX - r.left) / r.width * G.w;
    let i = 0;
    xs.forEach((v, j) => { if (Math.abs(v - x) < Math.abs(xs[i] - x)) i = j; });
    show(i);
  };
  svg.addEventListener('pointerdown', e => { svg.setPointerCapture(e.pointerId); pick(e); });
  svg.addEventListener('pointermove', e => { if (e.buttons || e.pointerType === 'mouse') pick(e); });
}

function powerArea(h, readout) {
  const [span, bucket] = h.range === '24h' ? [86400, 300] : [7 * 86400, 3600];
  const end = Date.now() / 1000, start = end - span;
  const max = niceMax(Math.max(...h.points.map(p => p[1])));
  const {svg, y} = frame(max, v => `${num(v, 0)} W`);
  const x = ts => G.l + (ts - start) / span * (G.w - G.l - G.r);
  // quebra a linha onde faltam dados (servidor parado, tomada offline) em vez de ligar os pontos por cima do buraco
  const segs = [];
  h.points.forEach((p, i) => { if (!i || p[0] - h.points[i - 1][0] > 2 * bucket) segs.push([]); segs.at(-1).push(p); });
  for (const seg of segs) {
    const line = seg.map((p, i) => `${i ? 'L' : 'M'}${x(p[0]).toFixed(1)},${y(p[1]).toFixed(1)}`).join('');
    const base = y(0).toFixed(1);
    svg.append(svgEl('path', {d: `${line}L${x(seg.at(-1)[0]).toFixed(1)},${base}L${x(seg[0][0]).toFixed(1)},${base}Z`, class: 'area'}),
               svgEl('path', {d: line, class: 'line'}));
  }
  const fmtX = ts => new Date(ts * 1000).toLocaleString('pt-BR', h.range === '24h'
    ? {hour: '2-digit', minute: '2-digit'} : {weekday: 'short', hour: '2-digit'});
  const tickFmt = ts => h.range === '24h' ? new Date(ts * 1000).getHours().toString().padStart(2, '0') + 'h'
    : new Date(ts * 1000).toLocaleString('pt-BR', {weekday: 'short'});
  xLabel(svg, x(start), tickFmt(start), 'start'); xLabel(svg, x(start + span / 2), tickFmt(start + span / 2)); xLabel(svg, x(end), 'agora', 'end');
  const cross = svgEl('line', {y1: G.t, y2: G.h - G.b, class: 'cross', visibility: 'hidden'});
  const dot = svgEl('circle', {r: 4, class: 'dot-mark', visibility: 'hidden'});
  svg.append(cross, dot);
  const xs = h.points.map(p => x(p[0]));
  scrub(svg, xs, i => {
    const [ts, w] = h.points[i];
    for (const [k, v] of [['x1', xs[i]], ['x2', xs[i]]]) cross.setAttribute(k, v);
    dot.setAttribute('cx', xs[i]); dot.setAttribute('cy', y(w));
    cross.setAttribute('visibility', 'visible'); dot.setAttribute('visibility', 'visible');
    readout.textContent = `${num(w, 0)} W · ${fmtX(ts)}`;
  });
  svg.setAttribute('aria-label', `Potência nas últimas ${RANGE_LABEL[h.range]}, máximo ${num(max, 0)} W`);
  return svg;
}

function dayBars(h, readout) {
  const days = 30, max = niceMax(Math.max(...h.points.map(p => p[1])));
  const {svg, y} = frame(max, v => num(v, max < 1 ? 2 : 1) + (v === max ? ' kWh' : ''));  // unidade só no topo
  const today = new Date(); today.setHours(12, 0, 0, 0);
  const slot = (G.w - G.l - G.r) / days, bw = Math.min(24, slot - 2);  // 2px de respiro entre colunas
  const byDay = Object.fromEntries(h.points);
  const bars = [], xs = [];
  for (let i = 0; i < days; i++) {
    const d = new Date(today - (days - 1 - i) * 864e5), key = d.toLocaleDateString('sv');  // AAAA-MM-DD local
    const cx = G.l + slot * (i + .5), v = byDay[key] ?? 0, top = y(v), base = y(0), r = Math.min(4, bw / 2, base - top);
    xs.push(cx);
    const bar = svgEl('path', {class: 'bar', d: v ? `M${cx - bw / 2},${base}V${top + r}Q${cx - bw / 2},${top} ${cx - bw / 2 + r},${top}` +
      `H${cx + bw / 2 - r}Q${cx + bw / 2},${top} ${cx + bw / 2},${top + r}V${base}Z` : ''});
    svg.append(bar);
    bars.push([d, v, bar]);
    if (i === days - 1) xLabel(svg, cx + bw / 2, 'hoje', 'end');
    else if (i % 7 === 2) xLabel(svg, cx, d.toLocaleDateString('pt-BR', {day: '2-digit', month: '2-digit'}));
  }
  scrub(svg, xs, i => {
    bars.forEach(([, , b], j) => b.classList.toggle('dim', j !== i));
    const [d, v] = bars[i];
    readout.textContent = `${num(v, 2)} kWh · ${d.toLocaleDateString('pt-BR', {weekday: 'short', day: '2-digit', month: '2-digit'})}`;
  });
  svg.setAttribute('aria-label', `Consumo por dia nos últimos 30 dias, máximo ${num(max, 2)} kWh`);
  return svg;
}

// a mesma informação em tabela, para leitor de tela. O sr-only vai numa div em volta: numa <table> o height: 1px
// não vale (tabela nunca fica menor que o conteúdo) e as 288 linhas viravam espaço de rolagem vazio no cartão
function dataTable(h) {
  const t = el('table');
  t.append(el('caption', {textContent: `Consumo, ${RANGE_LABEL[h.range]}`}));
  for (const [k, v] of h.points) {
    const label = typeof k === 'number' ? new Date(k * 1000).toLocaleString('pt-BR') : k;
    t.append(el('tr', {}, el('td', {textContent: label}), el('td', {textContent: h.unit === 'W' ? `${num(v, 0)} W` : `${num(v, 2)} kWh`})));
  }
  return el('div', {className: 'sr-only'}, t);
}

// ---- cenas: editor ----
// rascunho de um aparelho dentro da cena: cópia do item com os DPs da cena por cima; nunca fala com a casa
function draftOf(it, dps = {}) {
  const d = {...it, online: true, watts: null, timer_dp: null, dps: {...it.dps, ...dps}};
  Object.defineProperty(d, 'on', {get() { return !!this.dps[this.dp]; }});
  return d;
}
const draftTarget = d => ({
  get: () => d,
  apply: dps => { Object.assign(d.dps, dps); redraw(); },
  drag: dps => { Object.assign(d.dps, dps); },
  dragEnd: redraw,
});

function openScene(sc) {
  const devices = {};
  for (const [id, dps] of Object.entries(sc?.devices ?? {})) if (byId(id)) devices[id] = draftOf(byId(id), dps);
  openCard({kind: 'scene', key: sc ? 'scene:' + sc.id : 'scene:new', isNew: !sc, sub: null, adding: false,
            draft: {id: sc?.id ?? Date.now().toString(36), name: sc?.name ?? '', devices}});
}

const btn = (text, cls, onclick) => el('button', {className: 'btn ' + cls, textContent: text, onclick});
function summaryOf(d) { return d.on ? status(d) || 'ligado' : 'desligado'; }

function renderScene() {
  const st = current, draft = st.draft, body = $('c-body');
  const back = btn('‹ Voltar', 'link', () => { st.sub = null; st.adding = false; redraw(); });

  if (st.sub) {  // editando um aparelho da cena: os mesmos controles do cartão, apontando para o rascunho
    const remove = btn('Remover da cena', 'danger', () => { delete draft.devices[st.sub]; st.sub = null; redraw(); });
    renderDevice(draftTarget(draft.devices[st.sub]), [back]);
    body.append(el('div', {className: 'actions'}, remove));
    return;
  }
  $('c-name').textContent = st.isNew ? 'Nova cena' : draft.name;
  $('c-sub').textContent = '';

  if (st.adding) {
    body.append(back, el('div', {className: 'row-title', textContent: 'Adicionar aparelho'}));
    for (const it of last.filter(x => !draft.devices[x.id])) {
      body.append(el('div', {className: 'row', onclick: () => {
        draft.devices[it.id] = draftOf(it);  // entra com o estado de agora
        st.adding = false;
        st.sub = it.id;
        redraw();
      }}, el('div', {className: 'grow', textContent: it.name}), el('div', {className: 'muted', textContent: it.group})));
    }
    return;
  }

  const name = el('input', {className: 'name-input', type: 'text', value: draft.name, placeholder: 'Nome da cena', maxLength: 40});
  name.addEventListener('input', () => { draft.name = name.value; });
  body.append(name, el('div', {className: 'row-title', textContent: 'Aparelhos'}));
  for (const [id, d] of Object.entries(draft.devices)) {
    const dot = el('span', {className: 'dot'});
    dot.style.background = d.on ? colorOf(d) : 'transparent';
    const x = btn('✕', 'x', e => { e.stopPropagation(); delete draft.devices[id]; redraw(); });
    x.ariaLabel = `Remover ${d.name}`;
    body.append(el('div', {className: 'row', onclick: () => { st.sub = id; redraw(); }},
      dot, el('div', {className: 'grow', textContent: d.name}), el('div', {className: 'muted', textContent: summaryOf(d) + ' ›'}), x));
  }
  body.append(el('div', {className: 'row add', onclick: () => { st.adding = true; redraw(); }, textContent: '＋ Adicionar aparelho'}));

  const actions = el('div', {className: 'actions'});
  if (!st.isNew) actions.append(btn('Excluir', 'danger', async () => {
    if (!confirm(`Excluir a cena "${draft.name}"?`)) return;
    if (await saveScenes(scenes.filter(sc => sc.id !== draft.id))) closeCard();
  }));
  actions.append(btn('Salvar', 'primary', async () => {
    if (!draft.name.trim()) return showError('Dê um nome à cena');
    if (!Object.keys(draft.devices).length) return showError('Adicione pelo menos um aparelho');
    const sc = {id: draft.id, name: draft.name.trim(),
                devices: Object.fromEntries(Object.entries(draft.devices).map(([id, d]) => [id, stateDps(d)]))};
    const next = st.isNew ? [...scenes, sc] : scenes.map(x => x.id === sc.id ? sc : x);
    if (await saveScenes(next)) closeCard();
  }));
  body.append(actions);
}

async function saveScenes(next) {
  try {
    const r = await fetch('/api/scenes', {method: 'PUT', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(next)});
    const body = await r.json();
    if (!r.ok) throw new Error(body.error);
    scenes = body;
    showError('');
    return true;
  } catch (e) {
    showError(`Não salvou: ${e.message}`);
    return false;
  }
}

// sem um ouvinte de touchstart o Safari do iOS não aplica :active, e nenhum botão "afunda" ao toque
document.addEventListener('touchstart', () => {}, {passive: true});

// reforço do user-select: none no iOS, menos no campo de nome da cena
document.addEventListener('selectstart', e => { if (!e.target.closest?.('input')) e.preventDefault(); });

let timer;
function start() {
  clearInterval(timer);
  if (!document.hidden) { load(); timer = setInterval(load, 5000); }
}
document.addEventListener('visibilitychange', start);
loadScenes();
start();
</script>
