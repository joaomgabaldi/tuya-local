<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#000000">
<title>Casa · protótipo</title>
<style>
  /* PROTÓTIPO: dados de mentira, nada aqui fala com os aparelhos */
  :root { color-scheme: dark; --bg: #000; --tile: rgb(44 44 46 / .85); --tile-on: #f2f2f7; --txt: #f2f2f7;
          --sub: rgb(235 235 245 / .6); --card: rgb(28 28 30 / .92); --chip: rgb(118 118 128 / .24);
          --accent: #ffd60a; --ease: cubic-bezier(.2, .9, .25, 1.05); }
  * { -webkit-tap-highlight-color: transparent; }
  /* o dedo continua pressionado quando o cartão abre: sem isso o iOS seleciona tudo que está embaixo */
  html { -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
  body { margin: 0; padding: 12px 16px 32px; padding-top: max(12px, env(safe-area-inset-top));
         background: radial-gradient(120% 60% at 50% 0%, #1f2a44 0%, #000 70%) fixed; color: var(--txt);
         font: 17px -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, sans-serif; }
  .aviso { font-size: 12px; color: var(--sub); text-align: center; margin: 4px 0 8px; }
  h1 { font-size: 34px; font-weight: 700; margin: 8px 0 4px; letter-spacing: -.02em; }
  h2 { font-size: 20px; font-weight: 600; margin: 22px 0 10px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; }

  .tile { position: relative; box-sizing: border-box; height: 72px; padding: 10px 12px; border-radius: 16px;
          background: var(--tile); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
          display: flex; align-items: center; gap: 10px; cursor: pointer; touch-action: manipulation;
          -webkit-touch-callout: none; -webkit-user-select: none; user-select: none;
          transition: transform .18s var(--ease), background .2s; }
  .tile.pressing { transform: scale(.94); }
  .tile.on { background: var(--tile-on); color: #000; }
  .tile.on .sub { color: rgb(60 60 67 / .6); }
  .icon { flex: none; width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center;
          font-size: 17px; background: rgb(255 255 255 / .12); }
  .tile.on .icon { background: var(--dot, var(--accent)); color: #000; }
  .tile .txt { min-width: 0; line-height: 1.2; }
  .tile .name { font-size: 15px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .tile .sub { font-size: 13px; color: var(--sub); }

  /* cartão expandido */
  #overlay { position: fixed; inset: 0; background: rgb(0 0 0 / .35);
             backdrop-filter: blur(24px) saturate(1.4); -webkit-backdrop-filter: blur(24px) saturate(1.4); }
  #card { position: fixed; inset: 0; margin: auto; box-sizing: border-box; width: min(380px, calc(100vw - 32px));
          height: fit-content; max-height: calc(100dvh - 48px); overflow: auto; overscroll-behavior: contain;
          border-radius: 28px; background: var(--card); transform-origin: 0 0; padding: 0 20px 22px; }
  [hidden] { display: none !important; }
  .grab { padding: 10px 0 6px; touch-action: none; cursor: grab; }
  .grab::before { content: ""; display: block; width: 36px; height: 5px; border-radius: 3px;
                  background: rgb(255 255 255 / .3); margin: 0 auto 12px; }
  .grab .name { font-size: 22px; font-weight: 700; }
  .grab .sub { font-size: 15px; color: var(--sub); margin-top: 2px; }

  .pill { position: relative; width: 120px; height: 300px; max-height: 42dvh; margin: 18px auto 8px;
          border-radius: 36px; background: rgb(120 120 128 / .32); overflow: hidden; touch-action: none; cursor: ns-resize; }
  .pill .fill { position: absolute; left: 0; right: 0; bottom: 0; background: var(--fill, #fff);
                transition: background .25s; }
  .pill.dragging .fill { transition: background .25s; }
  .pill .ico { position: absolute; left: 0; right: 0; bottom: 18px; text-align: center; font-size: 26px;
               mix-blend-mode: difference; pointer-events: none; }
  .pill.toggle .fill { transition: height .25s var(--ease), background .25s; }

  .row-title { font-size: 13px; color: var(--sub); text-transform: uppercase; letter-spacing: .04em; margin: 18px 0 8px; }
  .swatches { display: flex; gap: 10px; flex-wrap: wrap; }
  .sw { width: 38px; height: 38px; border-radius: 50%; border: 0; padding: 0; background: var(--c);
        box-shadow: 0 0 0 2px transparent; transition: box-shadow .15s, transform .15s; cursor: pointer; }
  .sw.sel { box-shadow: 0 0 0 2px var(--card), 0 0 0 4px #fff; }
  .sw:active { transform: scale(.9); }
  .sw.custom { background: conic-gradient(red, yellow, lime, cyan, blue, magenta, red); position: relative; overflow: hidden; }
  .sw.custom input { position: absolute; inset: 0; opacity: 0; width: 100%; height: 100%; cursor: pointer; }
  .chips { display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none; margin: 0 -20px; padding: 0 20px; }
  .chips::-webkit-scrollbar { display: none; }
  .chip { flex: none; font: inherit; font-size: 15px; color: var(--txt); background: var(--chip); border: 0;
          border-radius: 999px; padding: 8px 14px; cursor: pointer; }
  .chip.sel { background: var(--txt); color: #000; }
  .chip:active { transform: scale(.95); }
</style>
</head>
<body>
<p class="aviso">Protótipo com dados de mentira · nada aqui mexe nos aparelhos</p>
<h1>Casa</h1>
<main id="app"></main>
<div id="overlay" hidden></div>
<div id="card" hidden role="dialog" aria-modal="true">
  <div class="grab"><div class="name" id="c-name"></div><div class="sub" id="c-sub"></div></div>
  <div id="c-body"></div>
</div>
<script>
// ---- dados de mentira, com os nomes reais da casa ----
const light = (name, extra) => ({name, kind: 'lamp', on: false, bright: 70, mode: 'white', temp: 30, h: 30, s: 90, scene: 0, timer: 0, ...extra});
const strip = (name, extra) => ({name, kind: 'strip', on: false, bright: 50, mode: 'colour', h: 210, s: 90, scene: 0, ...extra});
const sw = (name, extra) => ({name, kind: 'switch', on: false, timer: 0, ...extra});
const DEVICES = [
  ['Interruptores', [sw('Banheiro'), sw('Corredor'), sw('Cozinha', {on: true}), sw('Lavanderia', {offline: true}), sw('Mesa'), sw('Sala')]],
  ['Lâmpadas', [light('Abajur', {on: true, bright: 40, mode: 'colour', h: 28, s: 85}), light('L1'), light('L2'), light('Spot', {timer: 25})]],
  ['Fitas LED', [strip('Fita Led TV'), strip('Fita Monitor Centro', {on: true}), strip('Fita Monitor Direito', {on: true}), strip('Fita Monitor Esquerda', {on: true})]],
  ['Tomadas', [sw('PC', {kind: 'plug', on: true, watts: 91.1}), sw('Repelente', {kind: 'plug', watts: 0})]],
];
const COLORS = [[0, 90], [28, 95], [50, 95], [120, 70], [185, 80], [215, 90], [270, 75], [320, 80]];
const WHITES = [[0, '#ffc98a'], [30, '#ffe0b8'], [60, '#fff4e6'], [100, '#e6efff']];  // temp 0 = quente
const EFFECTS = ['Boa noite', 'Leitura', 'Trabalho', 'Lazer', 'Suave', 'Colorido', 'Vibrante', 'Deslumbrante'];

const $ = id => document.getElementById(id);
const el = (tag, props = {}, ...kids) => { const e = Object.assign(document.createElement(tag), props); e.append(...kids); return e; };
const clamp = (v, a, b) => Math.min(b, Math.max(a, v));

function colorOf(d) {
  if (d.kind === 'switch' || d.kind === 'plug') return 'var(--accent)';
  if (d.mode === 'scene') return 'linear-gradient(180deg, #ff5f6d, #ffc371, #47e891, #3fa7ff)';
  if (d.mode === 'white') return WHITES.reduce((a, w) => Math.abs(w[0] - d.temp) < Math.abs(a[0] - d.temp) ? w : a)[1];
  return `hsl(${d.h} ${d.s}% 58%)`;
}
function status(d) {
  if (d.offline) return 'Sem resposta';
  const parts = [];
  if (d.kind === 'plug') parts.push(`${d.watts.toFixed(1).replace('.', ',')} W`);
  else if (!d.on) parts.push('Desligado');
  else if (d.kind === 'switch') parts.push('Ligado');
  else parts.push(d.mode === 'scene' ? EFFECTS[d.scene] : `${Math.round(d.bright)}%`);
  if (d.timer) parts.push(`⏱ ${d.timer} min`);
  return parts.join(' · ');
}
const iconOf = d => ({switch: '💡', lamp: '💡', strip: '〰️', plug: '🔌'})[d.kind];

// ---- grade ----
function render() {
  $('app').replaceChildren();
  for (const [group, list] of DEVICES) {
    const grid = el('div', {className: 'grid'});
    $('app').append(el('h2', {textContent: group}), grid);
    for (const d of list) {
      const t = el('div', {className: 'tile' + (d.on ? ' on' : ''), role: 'button', tabIndex: 0},
        el('div', {className: 'icon', textContent: iconOf(d)}),
        el('div', {className: 'txt'}, el('div', {className: 'name', textContent: d.name}), el('div', {className: 'sub', textContent: status(d)})));
      if (d.offline) t.style.opacity = .45;
      t.style.setProperty('--dot', d.mode === 'scene' ? '#ffc371' : colorOf(d));
      d.tile = t;
      longPress(t, () => { if (!d.offline) { d.on = !d.on; render(); } }, () => openCard(d));
      grid.append(t);
    }
  }
}

// toque curto = alterna; segurar 500 ms = expande. Mexer o dedo > 10 px (rolagem) cancela.
function longPress(t, onTap, onHold) {
  let timer, held, x0, y0;
  const cancel = () => { clearTimeout(timer); t.classList.remove('pressing'); };
  t.addEventListener('pointerdown', e => {
    held = false; x0 = e.clientX; y0 = e.clientY;
    t.classList.add('pressing');
    timer = setTimeout(() => { held = true; cancel(); onHold(); }, 500);
  });
  t.addEventListener('pointermove', e => { if (Math.hypot(e.clientX - x0, e.clientY - y0) > 10) cancel(); });
  ['pointerup', 'pointercancel', 'pointerleave'].forEach(ev => t.addEventListener(ev, cancel));
  t.addEventListener('contextmenu', e => e.preventDefault());
  t.addEventListener('click', () => { if (!held) onTap(); });
}

// ---- cartão expandido (FLIP: nasce do retângulo do bloco) ----
let current = null;
// keyframe que põe o cartão exatamente sobre `rect` (o bloco). O raio é dividido pela escala
// de cada eixo para o canto continuar redondo em vez de virar elipse esticada.
function flipFrom(rect, radius = 16) {
  const to = $('card').getBoundingClientRect();
  const sx = rect.width / to.width, sy = rect.height / to.height;
  return {transform: `translate(${rect.left - to.left}px, ${rect.top - to.top}px) scale(${sx}, ${sy})`,
          borderRadius: `${radius / sx}px / ${radius / sy}px`};
}
const contentParts = () => [$('c-body'), $('card').querySelector('.grab')];
function openCard(d) {
  current = d;
  renderCard();
  $('overlay').hidden = $('card').hidden = false;
  const from = d.tile.getBoundingClientRect();
  $('card').animate([flipFrom(from), {transform: 'none', borderRadius: '28px'}],
                    {duration: 420, easing: 'cubic-bezier(.2, .9, .25, 1.04)'});
  for (const part of contentParts())
    part.animate([{opacity: 0}, {opacity: 1}], {duration: 220, delay: 180, fill: 'backwards'});
  $('overlay').animate([{opacity: 0}, {opacity: 1}], {duration: 300});
  d.tile.style.visibility = 'hidden';
}
function closeCard(fromY = 0) {
  const d = current;
  if (!d) return;
  current = null;
  render();  // o bloco já reflete o que mudou no cartão
  d.tile.style.visibility = 'hidden';
  const to = d.tile.getBoundingClientRect();
  const card = $('card');
  card.style.transform = '';
  const start = fromY ? `translateY(${fromY}px)` : 'none';
  // o conteúdo some ANTES de o cartão começar a encolher, então nunca aparece esmagado
  for (const part of contentParts()) part.animate([{opacity: 1}, {opacity: 0}], {duration: 90, fill: 'forwards'});
  const a = card.animate([{transform: start, borderRadius: '28px'}, flipFrom(to)],
                         {duration: 340, delay: 60, easing: 'cubic-bezier(.3, 0, .2, 1)', fill: 'forwards'});
  $('overlay').animate([{opacity: 1}, {opacity: 0}], {duration: 340, delay: 60, fill: 'forwards'});
  a.onfinish = () => {  // fill: forwards segura o último quadro; sem ele o cartão grande piscava antes de sumir
    d.tile.style.visibility = '';
    card.hidden = $('overlay').hidden = true;
    [card, $('overlay'), ...contentParts()].flatMap(x => x.getAnimations()).forEach(x => x.cancel());
  };
}
$('overlay').addEventListener('click', () => closeCard());

// arrastar para baixo pelo topo do cartão fecha
(() => {
  const grab = $('card').querySelector('.grab');
  let y0 = null, dy = 0;
  grab.addEventListener('pointerdown', e => { y0 = e.clientY; dy = 0; grab.setPointerCapture(e.pointerId); });
  grab.addEventListener('pointermove', e => {
    if (y0 === null) return;
    dy = Math.max(0, e.clientY - y0);
    $('card').style.transform = `translateY(${dy}px)`;
  });
  grab.addEventListener('pointerup', () => {
    if (y0 === null) return;
    y0 = null;
    if (dy > 90) return closeCard(dy);
    $('card').animate([{transform: `translateY(${dy}px)`}, {transform: 'none'}], {duration: 250, easing: 'cubic-bezier(.2, .9, .25, 1.1)'});
    $('card').style.transform = '';
  });
})();

function renderCard() {
  const d = current;
  $('c-name').textContent = d.name;
  $('c-sub').textContent = status(d);
  const body = $('c-body');
  body.replaceChildren();
  const refresh = () => { $('c-sub').textContent = status(d); };

  if (d.kind === 'lamp' || d.kind === 'strip') {
    body.append(brightPill(d, refresh));
    body.append(el('div', {className: 'row-title', textContent: 'Cores'}), swatchRow(
      COLORS.map(([h, s]) => ({c: `hsl(${h} ${s}% 58%)`, sel: d.mode === 'colour' && d.h === h, pick: () => Object.assign(d, {mode: 'colour', h, s, on: true})})),
      d, true));
    if (d.kind === 'lamp') {
      body.append(el('div', {className: 'row-title', textContent: 'Branco'}), swatchRow(
        WHITES.map(([temp, c]) => ({c, sel: d.mode === 'white' && d.temp === temp, pick: () => Object.assign(d, {mode: 'white', temp, on: true})})), d));
    }
    body.append(el('div', {className: 'row-title', textContent: 'Efeitos'}), chipRow(EFFECTS.map((name, i) => ({
      label: name, sel: d.mode === 'scene' && d.scene === i, pick: () => Object.assign(d, {mode: 'scene', scene: i, on: true})}))));
  } else {
    body.append(togglePill(d, refresh));
  }
  if (d.kind !== 'strip') {
    const label = d.timer ? `${d.on ? 'Desliga' : 'Liga'} em ${d.timer} min` : (d.on ? 'Desligar em' : 'Ligar em');
    const opts = [15, 30, 60, 120].map(m => ({label: m < 60 ? `${m} min` : `${m / 60} h`, sel: d.timer === m, pick: () => { d.timer = m; }}));
    if (d.timer) opts.push({label: 'Cancelar', pick: () => { d.timer = 0; }});
    body.append(el('div', {className: 'row-title', textContent: '⏱ ' + label}), chipRow(opts));
  }
}

let repaintPill = () => {};
function brightPill(d, refresh) {
  const fill = el('div', {className: 'fill'});
  const p = el('div', {className: 'pill'}, fill, el('div', {className: 'ico', textContent: '☀︎'}));
  const paint = () => { fill.style.height = (d.on ? d.bright : 0) + '%'; p.style.setProperty('--fill', colorOf(d)); };
  paint();
  repaintPill = paint;
  let y0 = null, v0, moved;
  p.addEventListener('pointerdown', e => { y0 = e.clientY; v0 = d.on ? d.bright : 0; moved = false; p.setPointerCapture(e.pointerId); });
  p.addEventListener('pointermove', e => {
    if (y0 === null) return;
    const dv = (y0 - e.clientY) / p.clientHeight * 100;
    if (Math.abs(dv) > 1) moved = true;
    if (!moved) return;
    const v = clamp(v0 + dv, 0, 100);
    d.on = v >= 1;
    if (d.on) d.bright = Math.max(1, v);
    paint(); refresh();
  });
  p.addEventListener('pointerup', () => {
    if (y0 !== null && !moved) { d.on = !d.on; paint(); refresh(); }  // toque sem arrastar = liga/desliga
    y0 = null;
  });
  return p;
}

function togglePill(d, refresh) {
  const fill = el('div', {className: 'fill'});
  const p = el('div', {className: 'pill toggle'}, fill, el('div', {className: 'ico', textContent: d.kind === 'plug' ? '🔌' : '⏻'}));
  const paint = () => { fill.style.height = d.on ? '100%' : '0%'; p.style.setProperty('--fill', 'var(--accent)'); };
  paint();
  p.addEventListener('click', () => { d.on = !d.on; paint(); refresh(); if (current) renderCard(); });
  return p;
}

function swatchRow(items, d, custom) {
  const row = el('div', {className: 'swatches'});
  for (const it of items) {
    const b = el('button', {className: 'sw' + (it.sel ? ' sel' : ''), onclick: () => { d.custom = false; it.pick(); renderCard(); }});
    b.style.setProperty('--c', it.c);
    row.append(b);
  }
  if (custom) {
    const input = el('input', {type: 'color', value: '#ff8800'});
    const label = el('label', {className: 'sw custom' + (d.custom && d.mode === 'colour' ? ' sel' : ''), title: 'Outra cor'}, input);
    // o seletor nativo do iOS fica preso a ESTE elemento: redesenhar o cartão aqui derrubava o Safari (SIGABRT).
    // então só atualiza estado e pinta no lugar, sem renderCard().
    input.addEventListener('input', () => {
      const [r, g, b] = [1, 3, 5].map(i => parseInt(input.value.slice(i, i + 2), 16) / 255);
      const max = Math.max(r, g, b), min = Math.min(r, g, b), c = max - min;
      const h = c === 0 ? 0 : max === r ? 60 * (((g - b) / c) % 6) : max === g ? 60 * ((b - r) / c + 2) : 60 * ((r - g) / c + 4);
      Object.assign(d, {mode: 'colour', h: Math.round((h + 360) % 360), s: Math.round(max ? c / max * 100 : 0), on: true, custom: true});
      $('card').querySelectorAll('.sw.sel, .chip.sel').forEach(x => x.classList.remove('sel'));
      label.classList.add('sel');
      repaintPill();
      $('c-sub').textContent = status(d);
    });
    row.append(label);
  }
  return row;
}

function chipRow(items) {
  const row = el('div', {className: 'chips'});
  for (const it of items) row.append(el('button', {className: 'chip' + (it.sel ? ' sel' : ''), textContent: it.label,
    onclick: () => { it.pick(); renderCard(); }}));
  return row;
}

document.addEventListener('selectstart', e => e.preventDefault());  // reforço do user-select: none no iOS
render();
</script>
</body>
</html>
